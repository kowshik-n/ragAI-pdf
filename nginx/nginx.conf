# Redirect all HTTP requests (including direct IP access) to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    return 301 https://ragai.buzz$request_uri;
}

# HTTPS server for your domain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name ragai.buzz www.ragai.buzz;

    ssl_certificate /etc/letsencrypt/live/ragai.buzz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ragai.buzz/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /upload/pdf {
        proxy_pass http://localhost:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chat {
        proxy_pass http://localhost:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}